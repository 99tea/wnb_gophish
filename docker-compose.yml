version: "3.9"

services:
  gophish:
    build: ./gophish
    container_name: gophish
    restart: always
    volumes:
      - ./gophish:/gophish
    environment:
      - ADMIN_IP=${SERVER_IP}
    ports:
      - "3333:3333"
      - "8080:8080"

  caddy:
    build: ./caddy
    container_name: caddy
    restart: always
    depends_on:
      - gophish
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_IP=${SERVER_IP}
      - ALLOWED_IP=${ALLOWED_IP}
      - LANDING_DOMAINS=${LANDING_DOMAINS}
    volumes:
      - ./caddy:/etc/caddy

  webhook_listener:
    build: ./webhook_listener
    container_name: webhook_listener
    restart: always
    depends_on:
      - gophish
    environment:
      - SERVER_IP=${SERVER_IP}
    ports:
      - "5000:5000"

  dropbox_sync:
    build: ./dropbox_sync
    container_name: dropbox_sync
    restart: always
    volumes:
      - ./dropbox:/dropbox
